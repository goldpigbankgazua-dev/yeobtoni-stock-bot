name: Update macro (글로벌 매크로)

on:
  # 자동 cron 비활성화 — Lightsail VM 의 ~/macro/run.sh (매 4시간) 가 메인.
  # workflow_dispatch 만 남김 (긴급 수동 trigger 용).
  # schedule:
  #   - cron: "0 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run macro fetcher
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python modules/macro/scripts/fetch_macro.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/macro/data/macro.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: macro $(date -u +%Y-%m-%d)"
            git push
          fi
