name: Update market (국내증시현황)

on:
  # Cron 비활성화: Oracle VM cron으로 이관됨 (~/market/run.sh).
  # GitHub Actions의 scheduled workflow는 신뢰성 부족(정시 미실행, 수시간 지연)으로
  # 수동 백업용 workflow_dispatch만 유지.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r modules/market/scripts/requirements.txt

      - name: Run market fetcher
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python modules/market/scripts/fetch_market.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/market/data/market.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: market $(date -u +%Y-%m-%d)"
            git push
          fi
