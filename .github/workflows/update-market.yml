name: Update market (국내증시현황)

on:
  schedule:
    # KST 18:00 = UTC 09:00 (평일만)
    # 주의: GitHub Actions scheduled workflow는 정시 보장 안 됨 (수시간 지연 가능).
    # Oracle VM 으로 이관 시도했으나 VM 메모리 부족 (1GB) 으로 보류.
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r modules/market/scripts/requirements.txt

      - name: Run market fetcher
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python modules/market/scripts/fetch_market.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/market/data/market.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: market $(date -u +%Y-%m-%d)"
            git push
          fi
