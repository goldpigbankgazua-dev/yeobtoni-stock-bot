<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>여비또니 주식봇</title>
<meta name="description" content="여비또니 주식봇 — RS 스크리너 · CHART 스크리너 · ETF 검색기를 한 화면에." />
<meta property="og:title" content="여비또니 주식봇" />
<meta property="og:description" content="RS · CHART · ETF, 한 화면에 모은 주식 대시보드." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='32' x2='32' y2='0'><stop offset='0' stop-color='%2300d4a4'/><stop offset='1' stop-color='%2300ffa3'/></linearGradient></defs><rect x='4' y='20' width='5' height='9' rx='1.5' fill='url(%23g)' opacity='.5'/><rect x='13' y='13' width='5' height='16' rx='1.5' fill='url(%23g)' opacity='.75'/><rect x='22' y='5' width='5' height='24' rx='1.5' fill='url(%23g)'/><path d='M5 23 L15 16 L25 7' stroke='%23ffffff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M21 7 L25 7 L25 11' stroke='%23ffffff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />

<style>
  :root {
    --bg: #0a0e14;
    --bg-elev: #11161f;
    --bg-elev-2: #161c27;
    --border: #1f2937;
    --border-strong: #2d3748;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-faint: #6e7681;
    --accent: #00d4a4;
    --accent-glow: rgba(0, 212, 164, .35);
    --accent-soft: rgba(0, 212, 164, .12);
    --danger: #f85149;
    --shadow: 0 8px 24px rgba(0,0,0,.5);
    --radius: 14px;
    --header-h: 64px;
  }

  :root[data-theme="light"] {
    --bg: #f8fafc;
    --bg-elev: #ffffff;
    --bg-elev-2: #f1f5f9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-dim: #475569;
    --text-faint: #94a3b8;
    --accent: #0ea5e9;
    --accent-glow: rgba(14, 165, 233, .22);
    --accent-soft: rgba(14, 165, 233, .10);
    --danger: #dc2626;
    --shadow: 0 4px 12px rgba(0,0,0,.06);
  }

  :root[data-theme="green"] {
    --bg: #ecfdf5;
    --bg-elev: #ffffff;
    --bg-elev-2: #f0fdf4;
    --border: #a7f3d0;
    --border-strong: #6ee7b7;
    --text: #064e3b;
    --text-dim: #047857;
    --text-faint: #10b981;
    --accent: #059669;
    --accent-glow: rgba(5, 150, 105, .22);
    --accent-soft: rgba(5, 150, 105, .10);
    --danger: #dc2626;
    --shadow: 0 4px 12px rgba(0,0,0,.05);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo",
                 "Noto Sans KR", Roboto, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ===== Header ===== */
  header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }

  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent) 0%, #00ffa3 100%);
    display: grid;
    place-items: center;
    box-shadow: 0 0 24px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.2);
    transition: transform .2s ease;
  }
  .brand:hover .brand-icon { transform: translateY(-1px) scale(1.04); }

  .brand-icon svg { display: block; }

  .brand-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.01em;
    background: linear-gradient(90deg, var(--text) 0%, var(--accent) 200%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  .brand-sub {
    color: var(--text-faint);
    font-size: 11px;
    margin-left: 2px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .nav {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .nav-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 7px;
    cursor: pointer;
    transition: all .15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .nav-btn:hover {
    color: var(--text);
    background: var(--accent-soft);
  }

  .nav-btn.active {
    color: #ffffff;
    background: var(--accent);
    box-shadow: 0 0 16px var(--accent-glow);
  }
  :root[data-theme="dark"] .nav-btn.active,
  :root:not([data-theme]) .nav-btn.active { color: #0a0e14; }

  .nav-btn .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: .5;
  }
  .nav-btn.active .dot { opacity: 1; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-elev-2);
    color: var(--text-dim);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all .15s ease;
  }
  .icon-btn:hover {
    color: var(--text);
    border-color: var(--border-strong);
  }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ===== Theme bar (3-mode toggle, CHART screener style) ===== */
  .themebar {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 9px;
  }
  .theme-pill {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    font-weight: 600;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all .12s ease;
    white-space: nowrap;
  }
  .theme-pill:hover { color: var(--text); }
  /* Selected colors — fixed per theme name (CHART style, regardless of current hub theme) */
  .theme-pill.active[data-pill="light"] { background: #e0f2fe; color: #0f172a; }
  .theme-pill.active[data-pill="dark"]  { background: #1e2a4a; color: #e2e8f0; }
  .theme-pill.active[data-pill="green"] { background: #a7f3d0; color: #065f46; }

  /* ===== Frame ===== */
  main {
    flex: 1;
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }

  .frame-wrap {
    position: absolute;
    inset: 0;
    display: none;
  }
  .frame-wrap.active { display: block; }

  .frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
    display: block;
  }

  /* Loading skeleton */
  .loader {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    background: var(--bg);
    transition: opacity .3s ease;
  }
  .loader.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Mobile ===== */
  @media (max-width: 720px) {
    :root { --header-h: auto; }
    header {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 10px 12px;
    }
    .brand-sub { display: none; }
    .nav {
      width: 100%;
      justify-content: space-between;
    }
    .nav-btn {
      flex: 1;
      justify-content: center;
      padding: 8px 8px;
      font-size: 12px;
    }
    .nav-btn .dot { display: none; }
    .header-actions { align-self: flex-end; }
    .theme-pill { padding: 5px 10px; font-size: 11px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand" onclick="location.reload()">
    <div class="brand-icon" aria-hidden="true">
      <!-- 까리한 상승 차트 아이콘: 캔들 3개 상승 + 트렌드 라인 + 화살표 -->
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
        <rect x="4"  y="20" width="5" height="9"  rx="1.5" fill="#ffffff" opacity=".4"/>
        <rect x="13" y="13" width="5" height="16" rx="1.5" fill="#ffffff" opacity=".65"/>
        <rect x="22" y="5"  width="5" height="24" rx="1.5" fill="#ffffff"/>
        <path d="M5 23 L15 16 L25 7" stroke="#0a0e14" stroke-width="2.2" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 7 L25 7 L25 11" stroke="#0a0e14" stroke-width="2.2" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="brand-title">여비또니 주식봇</div>
      <div class="brand-sub">stock toolkit</div>
    </div>
  </div>

  <nav class="nav" id="nav">
    <button class="nav-btn active" data-target="rs">
      <span class="dot"></span>RS스크리너
    </button>
    <button class="nav-btn" data-target="chart">
      <span class="dot"></span>차트스크리너
    </button>
    <button class="nav-btn" data-target="etf">
      <span class="dot"></span>ETF 추적기
    </button>
  </nav>

  <div class="header-actions">
    <button class="icon-btn" id="openExternal" title="공유하기" aria-label="공유하기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
    </button>
    <div class="themebar" id="themebar" role="group" aria-label="테마">
      <button class="theme-pill" data-pill="light">화이트</button>
      <button class="theme-pill" data-pill="dark">다크</button>
      <button class="theme-pill" data-pill="green">그린</button>
    </div>
  </div>
</header>

<main>
  <div class="loader" id="loader"><div class="spinner"></div></div>

  <div class="frame-wrap active" data-frame="rs">
    <iframe id="frame-rs" data-src="" title="RS스크리너"
            loading="eager" referrerpolicy="no-referrer"></iframe>
  </div>
  <div class="frame-wrap" data-frame="chart">
    <iframe id="frame-chart" data-src="" title="차트스크리너"
            loading="lazy" referrerpolicy="no-referrer"></iframe>
  </div>
  <div class="frame-wrap" data-frame="etf">
    <iframe id="frame-etf" data-src="" title="ETF 추적기"
            loading="lazy" referrerpolicy="no-referrer"></iframe>
  </div>
</main>

<script>
  /* =========================================================
     모듈 URL 설정 — 여기만 바꾸면 됩니다.
     ---------------------------------------------------------
     GitHub Pages 배포 시: 각 모듈이 호스팅된 URL을 넣으세요.
     로컬 미리보기 시: file:// 경로도 가능 (Firefox 권장).
     ========================================================= */
  const MODULES = {
    rs:    "https://goldpigbankgazua-dev.github.io/rs-screener-kr/",
    chart: "https://goldpigbankgazua-dev.github.io/chart-screener/",
    etf:   "https://goldpigbankgazua-dev.github.io/kr-new-listed-etf/",
  };

  /* ===== Theme (single source of truth — hub controls all modules) ===== */
  const THEMES = ["light", "dark", "green"];
  const root = document.documentElement;
  const themebar = document.getElementById("themebar");

  function currentTheme() {
    return root.getAttribute("data-theme") || "light";
  }
  function applyHubTheme(t) {
    if (!THEMES.includes(t)) t = "light";
    root.setAttribute("data-theme", t);
    localStorage.setItem("yeobtoni-theme", t);
    themebar.querySelectorAll(".theme-pill").forEach(p =>
      p.classList.toggle("active", p.dataset.pill === t)
    );
    broadcastTheme(t);
  }
  function broadcastTheme(t) {
    Object.values(frames).forEach(f => {
      try { f.contentWindow?.postMessage({ type: "yeobtoni-theme", value: t }, "*"); } catch (_) {}
    });
  }
  function withTheme(url, t) {
    const u = new URL(url, location.href);
    u.searchParams.set("theme", t);
    // 캐시 버스팅: 분 단위 버전. 새 hub 로드마다(1분 이상 차이 시) iframe도 무조건 새로 받음.
    u.searchParams.set("v", Math.floor(Date.now() / 60000).toString());
    return u.toString();
  }

  themebar.addEventListener("click", (e) => {
    const btn = e.target.closest(".theme-pill");
    if (!btn) return;
    applyHubTheme(btn.dataset.pill);
  });

  /* ===== Tabs + lazy iframe load ===== */
  const nav = document.getElementById("nav");
  const loader = document.getElementById("loader");
  const frames = {
    rs:    document.getElementById("frame-rs"),
    chart: document.getElementById("frame-chart"),
    etf:   document.getElementById("frame-etf"),
  };
  const wraps = document.querySelectorAll(".frame-wrap");
  const loaded = new Set();
  let current = "rs";

  function ensureLoaded(key) {
    if (loaded.has(key)) return;
    const f = frames[key];
    f.src = withTheme(MODULES[key], currentTheme());
    loaded.add(key);
    loader.classList.remove("hidden");
    f.addEventListener("load", () => {
      loader.classList.add("hidden");
      try { f.contentWindow?.postMessage({ type: "yeobtoni-theme", value: currentTheme() }, "*"); } catch (_) {}
    }, { once: true });
    // 안전장치: 8초 후엔 무조건 숨김
    setTimeout(() => loader.classList.add("hidden"), 8000);
  }

  function switchTo(key) {
    current = key;
    wraps.forEach(w => w.classList.toggle("active", w.dataset.frame === key));
    document.querySelectorAll(".nav-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.target === key)
    );
    ensureLoaded(key);
    history.replaceState(null, "", "#" + key);
  }

  nav.addEventListener("click", (e) => {
    const btn = e.target.closest(".nav-btn");
    if (!btn) return;
    switchTo(btn.dataset.target);
  });

  document.getElementById("openExternal").addEventListener("click", async () => {
    const url = MODULES[current];
    try {
      await navigator.clipboard.writeText(url);
      const btn = document.getElementById("openExternal");
      const orig = btn.title;
      btn.title = "URL 복사됨";
      setTimeout(() => { btn.title = orig; }, 1200);
    } catch (_) {
      window.open(url, "_blank", "noopener");
    }
  });

  // Initial: theme + tab
  applyHubTheme(localStorage.getItem("yeobtoni-theme") || "light");
  const initial = ["rs","chart","etf"].includes(location.hash.slice(1))
    ? location.hash.slice(1) : "rs";
  switchTo(initial);
</script>

</body>
</html>
