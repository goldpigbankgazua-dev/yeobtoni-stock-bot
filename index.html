<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>여비또니 주식봇</title>
<meta name="description" content="여비또니 주식봇 — RS 스크리너 · CHART 스크리너 · ETF 검색기를 한 화면에." />
<meta property="og:title" content="여비또니 주식봇" />
<meta property="og:description" content="RS · CHART · ETF, 한 화면에 모은 주식 대시보드." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='32' x2='32' y2='0'><stop offset='0' stop-color='%2300d4a4'/><stop offset='1' stop-color='%2300ffa3'/></linearGradient></defs><rect x='4' y='20' width='5' height='9' rx='1.5' fill='url(%23g)' opacity='.5'/><rect x='13' y='13' width='5' height='16' rx='1.5' fill='url(%23g)' opacity='.75'/><rect x='22' y='5' width='5' height='24' rx='1.5' fill='url(%23g)'/><path d='M5 23 L15 16 L25 7' stroke='%23ffffff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M21 7 L25 7 L25 11' stroke='%23ffffff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />

<style>
  :root {
    --bg: #0a0e14;
    --bg-elev: #11161f;
    --bg-elev-2: #161c27;
    --border: #1f2937;
    --border-strong: #2d3748;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-faint: #6e7681;
    --accent: #00d4a4;
    --accent-glow: rgba(0, 212, 164, .35);
    --accent-soft: rgba(0, 212, 164, .12);
    --danger: #f85149;
    --shadow: 0 8px 24px rgba(0,0,0,.5);
    --radius: 14px;
    --header-h: 64px;
  }

  :root[data-theme="light"] {
    --bg: #f6f8fa;
    --bg-elev: #ffffff;
    --bg-elev-2: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #0d1117;
    --text-dim: #4b5563;
    --text-faint: #6b7280;
    --accent: #059669;
    --accent-glow: rgba(5, 150, 105, .25);
    --accent-soft: rgba(5, 150, 105, .08);
    --danger: #dc2626;
    --shadow: 0 4px 12px rgba(0,0,0,.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo",
                 "Noto Sans KR", Roboto, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ===== Header ===== */
  header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }

  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent) 0%, #00ffa3 100%);
    display: grid;
    place-items: center;
    box-shadow: 0 0 24px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.2);
    transition: transform .2s ease;
  }
  .brand:hover .brand-icon { transform: translateY(-1px) scale(1.04); }

  .brand-icon svg { display: block; }

  .brand-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.01em;
    background: linear-gradient(90deg, var(--text) 0%, var(--accent) 200%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  .brand-sub {
    color: var(--text-faint);
    font-size: 11px;
    margin-left: 2px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .nav {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .nav-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 7px;
    cursor: pointer;
    transition: all .15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .nav-btn:hover {
    color: var(--text);
    background: var(--accent-soft);
  }

  .nav-btn.active {
    color: #0a0e14;
    background: var(--accent);
    box-shadow: 0 0 16px var(--accent-glow);
  }
  :root[data-theme="light"] .nav-btn.active { color: #fff; }

  .nav-btn .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: .5;
  }
  .nav-btn.active .dot { opacity: 1; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-elev-2);
    color: var(--text-dim);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all .15s ease;
  }
  .icon-btn:hover {
    color: var(--text);
    border-color: var(--border-strong);
  }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ===== Frame ===== */
  main {
    flex: 1;
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }

  .frame-wrap {
    position: absolute;
    inset: 0;
    display: none;
  }
  .frame-wrap.active { display: block; }

  .frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
    display: block;
  }

  /* Loading skeleton */
  .loader {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    background: var(--bg);
    transition: opacity .3s ease;
  }
  .loader.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Mobile ===== */
  @media (max-width: 720px) {
    :root { --header-h: auto; }
    header {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 10px 12px;
    }
    .brand-sub { display: none; }
    .nav {
      width: 100%;
      justify-content: space-between;
    }
    .nav-btn {
      flex: 1;
      justify-content: center;
      padding: 8px 8px;
      font-size: 12px;
    }
    .nav-btn .dot { display: none; }
    .header-actions { position: absolute; top: 14px; right: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand" onclick="location.reload()">
    <div class="brand-icon" aria-hidden="true">
      <!-- 까리한 상승 차트 아이콘: 캔들 3개 상승 + 트렌드 라인 + 화살표 -->
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
        <rect x="4"  y="20" width="5" height="9"  rx="1.5" fill="#ffffff" opacity=".4"/>
        <rect x="13" y="13" width="5" height="16" rx="1.5" fill="#ffffff" opacity=".65"/>
        <rect x="22" y="5"  width="5" height="24" rx="1.5" fill="#ffffff"/>
        <path d="M5 23 L15 16 L25 7" stroke="#0a0e14" stroke-width="2.2" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 7 L25 7 L25 11" stroke="#0a0e14" stroke-width="2.2" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="brand-title">여비또니 주식봇</div>
      <div class="brand-sub">stock toolkit</div>
    </div>
  </div>

  <nav class="nav" id="nav">
    <button class="nav-btn active" data-target="rs">
      <span class="dot"></span>RS 스크리너
    </button>
    <button class="nav-btn" data-target="chart">
      <span class="dot"></span>CHART 스크리너
    </button>
    <button class="nav-btn" data-target="etf">
      <span class="dot"></span>ETF 검색기
    </button>
  </nav>

  <div class="header-actions">
    <button class="icon-btn" id="openExternal" title="새 탭에서 열기" aria-label="새 탭에서 열기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
    </button>
    <button class="icon-btn" id="themeToggle" title="테마 전환" aria-label="테마 전환">
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="loader" id="loader"><div class="spinner"></div></div>

  <div class="frame-wrap active" data-frame="rs">
    <iframe id="frame-rs" data-src="" title="RS 스크리너"
            loading="eager" referrerpolicy="no-referrer"></iframe>
  </div>
  <div class="frame-wrap" data-frame="chart">
    <iframe id="frame-chart" data-src="" title="CHART 스크리너"
            loading="lazy" referrerpolicy="no-referrer"></iframe>
  </div>
  <div class="frame-wrap" data-frame="etf">
    <iframe id="frame-etf" data-src="" title="ETF 검색기"
            loading="lazy" referrerpolicy="no-referrer"></iframe>
  </div>
</main>

<script>
  /* =========================================================
     모듈 URL 설정 — 여기만 바꾸면 됩니다.
     ---------------------------------------------------------
     GitHub Pages 배포 시: 각 모듈이 호스팅된 URL을 넣으세요.
     로컬 미리보기 시: file:// 경로도 가능 (Firefox 권장).
     ========================================================= */
  const MODULES = {
    rs:    "https://goldpigbankgazua-dev.github.io/rs-screener-kr/",
    chart: "https://goldpigbankgazua-dev.github.io/chart-screener-kr/",   // ← 새 리포 만들어 배포 필요
    etf:   "https://goldpigbankgazua-dev.github.io/kr-new-listed-etf/",
  };

  /* ===== Theme ===== */
  const root = document.documentElement;
  const themeBtn = document.getElementById("themeToggle");
  const savedTheme = localStorage.getItem("yeobtoni-theme") || "dark";
  root.setAttribute("data-theme", savedTheme);
  themeBtn.addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("yeobtoni-theme", next);
  });

  /* ===== Tabs + lazy iframe load ===== */
  const nav = document.getElementById("nav");
  const loader = document.getElementById("loader");
  const frames = {
    rs:    document.getElementById("frame-rs"),
    chart: document.getElementById("frame-chart"),
    etf:   document.getElementById("frame-etf"),
  };
  const wraps = document.querySelectorAll(".frame-wrap");
  const loaded = new Set();
  let current = "rs";

  function ensureLoaded(key) {
    if (loaded.has(key)) return;
    const f = frames[key];
    f.src = MODULES[key];
    loaded.add(key);
    loader.classList.remove("hidden");
    f.addEventListener("load", () => loader.classList.add("hidden"), { once: true });
    // 안전장치: 8초 후엔 무조건 숨김
    setTimeout(() => loader.classList.add("hidden"), 8000);
  }

  function switchTo(key) {
    current = key;
    wraps.forEach(w => w.classList.toggle("active", w.dataset.frame === key));
    document.querySelectorAll(".nav-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.target === key)
    );
    ensureLoaded(key);
    history.replaceState(null, "", "#" + key);
  }

  nav.addEventListener("click", (e) => {
    const btn = e.target.closest(".nav-btn");
    if (!btn) return;
    switchTo(btn.dataset.target);
  });

  document.getElementById("openExternal").addEventListener("click", () => {
    window.open(MODULES[current], "_blank", "noopener");
  });

  // Initial load — respect hash if present
  const initial = ["rs","chart","etf"].includes(location.hash.slice(1))
    ? location.hash.slice(1) : "rs";
  switchTo(initial);
</script>

</body>
</html>
