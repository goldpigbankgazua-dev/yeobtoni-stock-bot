<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>여비또니 주식봇</title>
<meta name="description" content="여비또니 주식봇 — RS 스크리너 · 차트 스크리너 · ETF 추적기를 한 화면에." />
<meta property="og:title" content="여비또니 주식봇" />
<meta property="og:description" content="RS · CHART · ETF, 한 화면에 모은 주식 대시보드." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='32' x2='32' y2='0'><stop offset='0' stop-color='%2300d4a4'/><stop offset='1' stop-color='%2300ffa3'/></linearGradient></defs><rect x='4' y='20' width='5' height='9' rx='1.5' fill='url(%23g)' opacity='.5'/><rect x='13' y='13' width='5' height='16' rx='1.5' fill='url(%23g)' opacity='.75'/><rect x='22' y='5' width='5' height='24' rx='1.5' fill='url(%23g)'/><path d='M5 23 L15 16 L25 7' stroke='%23ffffff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M21 7 L25 7 L25 11' stroke='%23ffffff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />

<style>
  :root {
    --bg: #0a0e14;
    --bg-elev: #11161f;
    --bg-elev-2: #161c27;
    --border: #1f2937;
    --border-strong: #2d3748;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-faint: #6e7681;
    --accent: #00d4a4;
    --accent-glow: rgba(0, 212, 164, .35);
    --accent-soft: rgba(0, 212, 164, .12);
    --topbar-h: 56px;
    --sidebar-w: 200px;
  }
  :root[data-theme="light"] {
    --bg: #f8fafc; --bg-elev: #ffffff; --bg-elev-2: #f1f5f9;
    --border: #e2e8f0; --border-strong: #cbd5e1;
    --text: #0f172a; --text-dim: #475569; --text-faint: #94a3b8;
    --accent: #0ea5e9;
    --accent-glow: rgba(14,165,233,.22); --accent-soft: rgba(14,165,233,.10);
  }
  :root[data-theme="green"] {
    --bg: #ecfdf5; --bg-elev: #ffffff; --bg-elev-2: #f0fdf4;
    --border: #a7f3d0; --border-strong: #6ee7b7;
    --text: #064e3b; --text-dim: #047857; --text-faint: #10b981;
    --accent: #059669;
    --accent-glow: rgba(5,150,105,.22); --accent-soft: rgba(5,150,105,.10);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard",
                 "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  /* ===== 최상위 레이아웃: 상단바 + (사이드바 + 콘텐츠) ===== */
  body { display: flex; flex-direction: column; }

  /* ===== 상단 가로 바 ===== */
  header.topbar {
    height: var(--topbar-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; gap: 16px;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 10;
  }

  .brand {
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none;
    min-width: 0;
  }
  .brand-icon {
    width: 30px; height: 30px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent) 0%, #00ffa3 100%);
    display: grid; place-items: center; flex-shrink: 0;
    box-shadow: 0 0 14px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.2);
    transition: transform .15s ease;
  }
  .brand:hover .brand-icon { transform: translateY(-1px) scale(1.04); }
  .brand-title {
    font-size: 16px; font-weight: 700; letter-spacing: -.01em;
    white-space: nowrap;
  }
  .brand-sub {
    color: var(--text-faint); font-size: 12px; font-weight: 500;
    margin-left: 4px;
    white-space: nowrap;
  }

  /* 우측: 공유 + 테마 */
  .top-actions { display: flex; align-items: center; gap: 8px; }

  .icon-btn {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-elev-2);
    color: var(--text-dim); cursor: pointer;
    display: grid; place-items: center;
    transition: all .15s ease;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .icon-btn svg { width: 16px; height: 16px; }

  .themebar {
    display: inline-flex; gap: 2px; padding: 3px;
    background: var(--bg-elev-2); border: 1px solid var(--border);
    border-radius: 9px;
  }
  .theme-pill {
    appearance: none; border: 0; background: transparent;
    color: var(--text-dim); font: inherit;
    font-weight: 600; font-size: 12px;
    padding: 5px 11px; border-radius: 6px; cursor: pointer;
    transition: all .12s ease; white-space: nowrap;
  }
  .theme-pill:hover { color: var(--text); }
  .theme-pill.active[data-pill="light"] { background: #e0f2fe; color: #0f172a; }
  .theme-pill.active[data-pill="dark"]  { background: #1e2a4a; color: #e2e8f0; }
  .theme-pill.active[data-pill="green"] { background: #a7f3d0; color: #065f46; }

  /* ===== 본문: 사이드바 + 콘텐츠 ===== */
  .layout {
    flex: 1; display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: 1fr;
    min-height: 0;
  }

  /* 좌측 사이드바 (모듈 메뉴) */
  aside.sidebar {
    background: var(--bg);
    padding: 22px 14px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 2px;
    grid-column: 1; grid-row: 1;
    border-right: 1px solid var(--border);
  }

  /* backdrop은 기본적으로 grid 밖으로 (모바일에서만 표시) */
  .sidebar-backdrop { display: none; }
  .nav-item {
    appearance: none; border: 0; background: transparent;
    color: var(--text-dim); font: inherit;
    font-weight: 500; font-size: 14px;
    padding: 9px 14px; border-radius: 8px;
    cursor: pointer; transition: all .12s ease;
    text-align: left; width: 100%;
    position: relative;
  }
  .nav-item:hover { color: var(--text); background: var(--accent-soft); }
  .nav-item.active {
    color: var(--accent); background: var(--accent-soft);
    font-weight: 700;
  }
  .nav-item.active::before {
    content: ""; position: absolute;
    left: 0; top: 6px; bottom: 6px;
    width: 3px; border-radius: 2px;
    background: var(--accent);
  }

  /* 우측 콘텐츠 */
  .content {
    position: relative; background: var(--bg);
    overflow: hidden; min-width: 0; min-height: 0;
    grid-column: 2; grid-row: 1;
    height: 100%;
  }
  .frame-wrap { position: absolute; inset: 0; display: none; }
  .frame-wrap.active { display: block; }
  .frame-wrap iframe { width: 100%; height: 100%; border: 0; background: var(--bg); display: block; }

  .loader {
    position: absolute; inset: 0;
    display: grid; place-items: center; pointer-events: none;
    background: var(--bg); transition: opacity .3s ease;
  }
  .loader.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 32px; height: 32px;
    border: 2.5px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 기본: 메뉴 토글은 데스크탑에서 숨김 (미디어쿼리보다 위에 둬야 모바일 override가 먹힘) */
  .menu-toggle { display: none; }

  /* ===== 모바일 ===== */
  @media (max-width: 720px) {
    header.topbar { padding: 0 14px; gap: 10px; }
    .brand-sub { display: none; }
    /* 모바일에선 grid 해제 — 사이드바는 fixed라 흐름 밖, 콘텐츠만 normal flow로 전체 차지 */
    .layout { display: block; position: relative; }
    .content { grid-column: auto; grid-row: auto; width: 100%; height: 100%; }
    aside.sidebar {
      position: fixed; top: var(--topbar-h); left: 0; bottom: 0;
      width: 220px; max-width: 80vw; z-index: 30;
      background: var(--bg-elev); border-right: 1px solid var(--border);
      transform: translateX(-100%);
      transition: transform .2s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    aside.sidebar.open { transform: translateX(0); }
    .sidebar-backdrop {
      position: fixed; top: var(--topbar-h); left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,.45); z-index: 25;
    }
    .sidebar-backdrop.show { display: block; }
    .menu-toggle { display: grid; }
    .themebar { padding: 2px; }
    .theme-pill { padding: 4px 8px; font-size: 11px; }
  }
</style>
</head>
<body>

<!-- ===== 상단 가로 바 ===== -->
<header class="topbar">
  <div style="display:flex; align-items:center; gap:12px; min-width:0;">
    <button class="icon-btn menu-toggle" id="menuToggle" title="메뉴" aria-label="메뉴">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand" onclick="location.reload()">
      <div class="brand-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 32 32" fill="none">
          <rect x="4"  y="20" width="5" height="9"  rx="1.5" fill="#ffffff" opacity=".4"/>
          <rect x="13" y="13" width="5" height="16" rx="1.5" fill="#ffffff" opacity=".65"/>
          <rect x="22" y="5"  width="5" height="24" rx="1.5" fill="#ffffff"/>
          <path d="M5 23 L15 16 L25 7" stroke="#0a0e14" stroke-width="2.2" fill="none"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 7 L25 7 L25 11" stroke="#0a0e14" stroke-width="2.2" fill="none"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-title">여비또니 주식봇</span>
      <span class="brand-sub">실시간 주식 대시보드</span>
    </div>
  </div>

  <div class="top-actions">
    <button class="icon-btn" id="openExternal" title="공유하기" aria-label="공유하기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
    </button>
    <div class="themebar" id="themebar" role="group" aria-label="테마">
      <button class="theme-pill" data-pill="light">화이트</button>
      <button class="theme-pill" data-pill="dark">다크</button>
      <button class="theme-pill" data-pill="green">그린</button>
    </div>
  </div>
</header>

<!-- ===== 본문: 좌측 메뉴 + 우측 콘텐츠 ===== -->
<div class="layout">

  <aside class="sidebar" id="sidebar">
    <nav id="nav" role="navigation" style="display:flex; flex-direction:column; gap:2px;">
      <button class="nav-item active" data-target="rs">RS SCREENER</button>
      <button class="nav-item" data-target="chart">STOCK SCREENER</button>
      <button class="nav-item" data-target="etf">ETF 추적기</button>
    </nav>
  </aside>
  <div class="sidebar-backdrop" id="backdrop"></div>

  <section class="content">
    <div class="loader" id="loader"><div class="spinner"></div></div>

    <div class="frame-wrap active" data-frame="rs">
      <iframe id="frame-rs" data-src="" title="RS스크리너" loading="eager" referrerpolicy="no-referrer"></iframe>
    </div>
    <div class="frame-wrap" data-frame="chart">
      <iframe id="frame-chart" data-src="" title="차트스크리너" loading="lazy" referrerpolicy="no-referrer"></iframe>
    </div>
    <div class="frame-wrap" data-frame="etf">
      <iframe id="frame-etf" data-src="" title="ETF 추적기" loading="lazy" referrerpolicy="no-referrer"></iframe>
    </div>
  </section>

</div>

<script>
  const MODULES = {
    rs:    "https://goldpigbankgazua-dev.github.io/rs-screener-kr/",
    chart: "https://goldpigbankgazua-dev.github.io/chart-screener/",
    etf:   "https://goldpigbankgazua-dev.github.io/kr-new-listed-etf/",
  };

  const THEMES = ["light", "dark", "green"];
  const root = document.documentElement;
  const themebar = document.getElementById("themebar");

  function currentTheme() { return root.getAttribute("data-theme") || "light"; }
  function applyHubTheme(t) {
    if (!THEMES.includes(t)) t = "light";
    root.setAttribute("data-theme", t);
    localStorage.setItem("yeobtoni-theme", t);
    themebar.querySelectorAll(".theme-pill").forEach(p =>
      p.classList.toggle("active", p.dataset.pill === t)
    );
    broadcastTheme(t);
  }
  function broadcastTheme(t) {
    Object.values(frames).forEach(f => {
      try { f.contentWindow?.postMessage({ type: "yeobtoni-theme", value: t }, "*"); } catch (_) {}
    });
  }
  function withTheme(url, t) {
    const u = new URL(url, location.href);
    u.searchParams.set("theme", t);
    u.searchParams.set("v", Math.floor(Date.now() / 60000).toString());
    return u.toString();
  }
  themebar.addEventListener("click", (e) => {
    const btn = e.target.closest(".theme-pill"); if (!btn) return;
    applyHubTheme(btn.dataset.pill);
  });

  const nav = document.getElementById("nav");
  const loader = document.getElementById("loader");
  const frames = {
    rs:    document.getElementById("frame-rs"),
    chart: document.getElementById("frame-chart"),
    etf:   document.getElementById("frame-etf"),
  };
  const wraps = document.querySelectorAll(".frame-wrap");
  const loaded = new Set();
  let current = "rs";

  function ensureLoaded(key) {
    if (loaded.has(key)) return;
    const f = frames[key];
    f.src = withTheme(MODULES[key], currentTheme());
    loaded.add(key);
    loader.classList.remove("hidden");
    f.addEventListener("load", () => {
      loader.classList.add("hidden");
      try { f.contentWindow?.postMessage({ type: "yeobtoni-theme", value: currentTheme() }, "*"); } catch (_) {}
    }, { once: true });
    setTimeout(() => loader.classList.add("hidden"), 8000);
  }

  function switchTo(key) {
    current = key;
    wraps.forEach(w => w.classList.toggle("active", w.dataset.frame === key));
    document.querySelectorAll(".nav-item").forEach(b =>
      b.classList.toggle("active", b.dataset.target === key)
    );
    ensureLoaded(key);
    history.replaceState(null, "", "#" + key);
    closeSidebar();
  }

  nav.addEventListener("click", (e) => {
    const btn = e.target.closest(".nav-item"); if (!btn) return;
    switchTo(btn.dataset.target);
  });

  function showToast(msg) {
    let t = document.getElementById("yt-toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "yt-toast";
      t.style.cssText = "position:fixed;left:50%;bottom:32px;transform:translateX(-50%);"
        + "background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border);"
        + "padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;"
        + "box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:1000;opacity:0;"
        + "transition:opacity .2s ease;pointer-events:none;white-space:nowrap;";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    requestAnimationFrame(() => { t.style.opacity = "1"; });
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = "0"; }, 1800);
  }

  document.getElementById("openExternal").addEventListener("click", async () => {
    const url = MODULES[current];
    // 1) 새 탭에서 모듈 열기 (가장 명확한 동작)
    window.open(url, "_blank", "noopener");
    // 2) 동시에 URL 클립보드 복사 시도 (실패해도 무시)
    try {
      await navigator.clipboard.writeText(url);
      showToast("새 탭으로 열고 URL을 복사했어요");
    } catch (_) {
      showToast("새 탭에서 모듈을 열었어요");
    }
  });

  /* 모바일 사이드바 */
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("backdrop");
  function openSidebar()  { sidebar.classList.add("open"); backdrop.classList.add("show"); }
  function closeSidebar() { sidebar.classList.remove("open"); backdrop.classList.remove("show"); }
  document.getElementById("menuToggle").addEventListener("click", openSidebar);
  backdrop.addEventListener("click", closeSidebar);

  applyHubTheme(localStorage.getItem("yeobtoni-theme") || "light");
  const initial = ["rs","chart","etf"].includes(location.hash.slice(1))
    ? location.hash.slice(1) : "rs";
  switchTo(initial);
</script>

</body>
</html>
