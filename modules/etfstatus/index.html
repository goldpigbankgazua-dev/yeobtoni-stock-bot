<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ETF CHECK — 여비또니 주식봇</title>
<style>
:root {
  --bg:#f8fafc; --card:#ffffff; --thead:#f1f5f9; --line:#e2e8f0; --line-soft:#eef2f6;
  --text:#1a1d24; --text-strong:#0f172a; --muted:#64748b; --muted-2:#94a3b8;
  --accent:#0ea5e9; --accent-soft:rgba(14,165,233,.10);
  --up:#dc2626; --down:#2563eb;
}
:root[data-theme="dark"], body.theme-dark {
  --bg:#0b1220; --card:#121a2b; --thead:#0f1626; --line:#1f2a44; --line-soft:#192238;
  --text:#cbd5e1; --text-strong:#f1f5f9; --muted:#94a3b8; --muted-2:#64748b;
  --accent:#22d3ee; --accent-soft:rgba(34,211,238,.12);
  --up:#f87171; --down:#60a5fa;
}
:root[data-theme="green"], body.theme-green {
  --bg:#ecfdf5; --card:#ffffff; --thead:#f0fdf4; --line:#a7f3d0; --line-soft:#d1fae5;
  --text:#064e3b; --text-strong:#022c22; --muted:#047857; --muted-2:#10b981;
  --accent:#059669; --accent-soft:rgba(5,150,105,.12);
  --up:#dc2626; --down:#1d4ed8;
}

* { box-sizing:border-box; margin:0; padding:0; }
html, body { overflow-x:hidden; max-width:100vw; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55; padding:20px;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  transition:background .15s ease, color .15s ease;
}
.container { max-width:1200px; margin:0 auto; }

header { margin-bottom:14px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
.header-left { flex:1; min-width:200px; }
h1 { font-size:22px; font-weight:700; margin:0 0 2px 0; color:var(--text-strong); }
.subtitle { color:var(--muted); font-size:13px; margin:0; }
.basedate { color:var(--muted); background:var(--card); border:1px solid var(--line);
  padding:6px 12px; border-radius:8px; font-size:12px; white-space:nowrap; flex-shrink:0; }
.basedate b { color:var(--accent); }

/* 카테고리 탭바 + 기간 드롭다운 가로 배치 (데스크탑) / 세로 (모바일) */
.controls-row { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
.controls-row .tabs-wrap { flex:1; min-width:0; margin-bottom:0; }
.controls-row .period-wrap { flex-shrink:0; margin-bottom:0; }
@media (max-width:720px) {
  .controls-row { flex-direction:column; align-items:stretch; }
  .controls-row .period-wrap > .period-bar { width:100%; max-width:none; }
}

.tabs-wrap { background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:0 4px; height:36px; box-sizing:border-box; margin-bottom:10px;
  box-shadow:0 1px 3px rgba(15,23,42,.04); overflow-x:auto;
  -webkit-overflow-scrolling:touch; display:flex; align-items:center; }
.tabs { display:flex; gap:2px; min-width:max-content; align-items:center; }
.tab-btn { appearance:none; border:1px solid transparent; background:transparent; color:var(--muted);
  font:inherit; font-size:13px; font-weight:600; padding:5px 12px; border-radius:7px;
  cursor:pointer; transition:all .12s ease; white-space:nowrap; }
.tab-btn:hover { color:var(--text-strong); background:var(--thead); }
.tab-btn.active { color:var(--accent); background:var(--accent-soft); }
.tab-btn[disabled] { opacity:.45; cursor:not-allowed; }
.tab-btn[disabled]:hover { color:var(--muted); background:transparent; }

/* 기간 드롭다운 (STOCK 스크리너 pill 스타일) */
.period-wrap { margin-bottom:14px; }
.period-bar { display:inline-flex; align-items:stretch; background:var(--card); border:1px solid var(--line);
  border-radius:10px; overflow:hidden; height:36px; min-width:180px; max-width:280px;
  transition:border-color .12s ease, box-shadow .12s ease; }
.period-bar:hover { border-color:var(--muted-2); }
.period-bar:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.period-bar > .lbl { display:flex; align-items:center; flex-shrink:0; padding:0 12px; background:var(--thead);
  border-right:1px solid var(--line); font-size:12px; font-weight:600; color:var(--muted);
  white-space:nowrap; user-select:none; }
.period-bar > select { flex:1; min-width:0; background:transparent; color:var(--text-strong); border:0;
  padding:0 30px 0 12px; outline:none; font:inherit; font-size:13px; font-weight:600;
  line-height:34px; appearance:none; -webkit-appearance:none; cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path fill='none' stroke='%2394a3b8' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round' d='M1 1.5l5 5 5-5'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center; background-size:10px; }
.period-bar.snapshot { background:var(--thead); color:var(--muted-2); align-items:center; padding:0 14px; font-size:12px; font-weight:600; }

/* 테이블 카드 */
.tbl-card { background:var(--card); border:1px solid var(--line); border-radius:14px;
  overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  box-shadow:0 1px 3px rgba(15,23,42,.04);
  scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
.tbl-card::-webkit-scrollbar { height:8px; }
.tbl-card::-webkit-scrollbar-track { background:transparent; }
.tbl-card::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px;
  border:2px solid var(--card); background-clip:padding-box; }
.tbl-card::-webkit-scrollbar-thumb:hover { background:var(--muted); border:2px solid var(--card); background-clip:padding-box; }
table { width:100%; border-collapse:collapse; min-width:720px; table-layout:fixed; }
/* 모든 카테고리 공통 — 4컬럼 균형 (순위·종목명·지표1·지표2) */
thead th:nth-child(1), tbody td:nth-child(1) { width:48px; }   /* 순위 */
thead th:nth-child(2), tbody td:nth-child(2) { width:230px; }  /* 종목명 */
/* 지표 컬럼은 자동 분배 — header truncation 방지 */
thead th { background:var(--thead); color:var(--muted); font-weight:700; font-size:12px;
  padding:11px 12px; text-align:center; border-bottom:1px solid var(--line);
  white-space:nowrap; position:sticky; top:0; z-index:1; }
thead th.left { text-align:left; }
tbody td { padding:10px 12px; border-bottom:1px solid var(--line-soft); font-size:13px;
  color:var(--text); text-align:center; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
tbody td.left { text-align:left; }
tbody td.rank { color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; }
tbody td.name { color:var(--text-strong); font-weight:600; }
tbody td.ticker { color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
tbody td.num { font-variant-numeric:tabular-nums; }
tbody td.up { color:var(--up); font-weight:700; font-variant-numeric:tabular-nums; }
tbody td.down { color:var(--down); font-weight:700; font-variant-numeric:tabular-nums; }
tbody tr:hover { background:var(--accent-soft); cursor:pointer; }
tbody tr:last-child td { border-bottom:none; }

/* 빈 상태 / 로딩 */
.empty, .loading { padding:60px 20px; text-align:center; color:var(--muted); font-size:13px; }
.empty b { display:block; color:var(--text-strong); font-size:14px; font-weight:700; margin-bottom:6px; }
.spinner-mini { width:18px; height:18px; border:2px solid var(--line); border-top-color:var(--accent);
  border-radius:50%; animation:spin .7s linear infinite; display:inline-block; margin-right:8px;
  vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }

footer { color:var(--muted); font-size:12px; margin-top:18px; padding:14px 16px; background:var(--thead);
  border-radius:10px; border:1px solid var(--line); }
footer a { color:var(--accent); text-decoration:none; }
footer a:hover { text-decoration:underline; }

@media (max-width:720px) {
  body { padding:14px 10px; }
  h1 { font-size:18px; }
  .subtitle { font-size:12px; }
  .basedate { font-size:11px; padding:4px 9px; }
  .tab-btn { font-size:12px; padding:6px 10px; }
  thead th, tbody td { padding:8px 10px; font-size:12px; }
  /* 모바일에서 종목명 너비 축소 — 좌우 스크롤 허용 */
  thead th:nth-child(2), tbody td:nth-child(2) { width:220px; }
}
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-left">
      <h1>ETF CHECK</h1>
      <p class="subtitle">ETF 수익률 · 자금유입 · 순자산증감 · 투자자 · 운용규모 · 거래량 조회</p>
    </div>
    <div class="basedate" id="basedate">기준일 <b id="basedateText">—</b></div>
  </header>

  <div class="controls-row">
    <div class="tabs-wrap">
      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-cat="yield">수익률</button>
        <button class="tab-btn" data-cat="fundflow">자금유입</button>
        <button class="tab-btn" data-cat="navchange">순자산증감</button>
        <button class="tab-btn" data-cat="investor">투자자</button>
        <button class="tab-btn" data-cat="aum">운용규모</button>
        <button class="tab-btn" data-cat="volume">거래량</button>
      </div>
    </div>
    <div class="period-wrap">
      <div class="period-bar" id="periodBar"></div>
    </div>
  </div>

  <div class="tbl-card">
    <div id="tableMount">
      <div class="loading"><span class="spinner-mini"></span>데이터 로드 중…</div>
    </div>
  </div>

  <footer>
    데이터 출처: <a href="https://www.etfcheck.co.kr/" target="_blank" rel="noopener">ETF CHECK</a> · 매일 자동 갱신 · 등락률 빨강(상승) / 파랑(하락)
  </footer>

</div>

<script>
/* ===== 테마 동기화 (허브 postMessage + URL 쿼리) ===== */
(function(){
  const root = document.documentElement;
  function setTheme(t) {
    if (!['light','dark','green'].includes(t)) return;
    root.setAttribute('data-theme', t);
    document.body.className = 'theme-' + t;
  }
  // 1) URL 쿼리
  const qs = new URLSearchParams(location.search);
  const initT = qs.get('theme') || 'light';
  setTheme(initT);
  // 2) 허브에서 postMessage
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (m && m.type === 'yeobtoni-theme' && m.value) setTheme(m.value);
  });
})();

/* ===== 카테고리별 기간 옵션 ===== */
const PERIODS = {
  yield:    [['1d','당일'], ['1w','1주'], ['1m','1개월'], ['3m','3개월'], ['6m','6개월'], ['ytd','YTD'], ['1y','1년']],
  fundflow: [['1d','전일'], ['1w','1주'], ['1m','1개월'], ['3m','3개월'], ['6m','6개월'], ['ytd','YTD'], ['1y','1년']],
  navchange:[['1d','전일'], ['1w','1주'], ['1m','1개월'], ['3m','3개월'], ['6m','6개월'], ['ytd','YTD'], ['1y','1년']],
  investor: [['1d','전일'], ['1w','1주'], ['1m','1개월'], ['3m','3개월'], ['6m','6개월'], ['ytd','YTD'], ['1y','1년']],
  volume:   [['1d','전일'], ['5d_avg','5일평균'], ['10d_avg','10일평균']],
  aum:      [],
};

// 카테고리별 디폴트 기간 — 모두 1일치 (누적 데이터 쌓이기 전까지)
const DEFAULT_PERIOD = {
  yield: '1d',
  fundflow: '1d',
  navchange: '1d',
  investor: '1d',
  volume: '1d',
};

const lastPeriodByCat = {};
let currentPeriod = '1d';

/* ===== 카테고리 정의 ===== */
const CATEGORIES = {
  yield: {
    label: '수익률',
    columns: [
      { key: '_rank', label: '순위', cls: 'rank num' },
      { key: 'F16002', label: '종목명', cls: 'name left' },
      { key: 'F15004', label: '등락률', cls: 'num', fmt: 'pctSigned' },
      { key: 'NAV_YIELD', label: 'NAV수익률', cls: 'num', fmt: 'pctSigned' },
    ],
  },
  fundflow: {
    label: '자금유입',
    columns: [
      { key: '_rank', label: '순위', cls: 'rank num' },
      { key: 'F16002', label: '종목명', cls: 'name left' },
      { key: 'INFLOW', label: '자금유입(억원)', cls: 'num', fmt: 'okwon' },
      { key: 'F15004', label: '등락률', cls: 'num', fmt: 'pctSigned' },
    ],
  },
  navchange: {
    label: '순자산증감',
    sortKey: 'AUM_VAR', sortDir: 'desc',
    columns: [
      { key: '_rank', label: '순위', cls: 'rank num' },
      { key: 'F16002', label: '종목명', cls: 'name left' },
      { key: 'AUM_VAR', label: '순자산 변화(억원)', cls: 'num', fmt: 'okwonSigned' },
      { key: 'AUM',     label: '순자산총액(억원)', cls: 'num', fmt: 'okwon' },
    ],
  },
  investor: {
    label: '투자자',
    columns: [
      { key: '_rank', label: '순위', cls: 'rank num' },
      { key: 'F16002', label: '종목명', cls: 'name left' },
      { key: 'RANK_VALUE', label: '순매수금액(억원)', cls: 'num', fmt: 'okwon' },
      { key: 'YIELD', label: '수익률', cls: 'num', fmt: 'pctSigned' },
    ],
  },
  aum: {
    label: '운용규모',
    sortKey: 'AUM', sortDir: 'desc',
    columns: [
      { key: '_rank', label: '순위', cls: 'rank num' },
      { key: 'F16002', label: '종목명', cls: 'name left' },
      { key: 'AUM',     label: 'AUM(억원)', cls: 'num', fmt: 'okwon' },
      { key: 'AUM_VAR', label: '순자산 변화(억원)', cls: 'num', fmt: 'okwonSigned' },
    ],
  },
  volume: {
    label: '거래량',
    columns: [
      { key: '_rank', label: '순위', cls: 'rank num' },
      { key: 'F16002', label: '종목명', cls: 'name left' },
      { key: 'F15015', label: '거래량(주)', cls: 'num', fmt: 'comma' },
      { key: 'F15023', label: '거래대금(억원)', cls: 'num', fmt: 'okwon' },
    ],
  },
};

/* ===== pending 카테고리 탭은 disable ===== */
document.querySelectorAll('.tab-btn').forEach(b => {
  const cat = b.dataset.cat;
  if (CATEGORIES[cat]?.status === 'pending') {
    b.disabled = true;
    b.title = '데이터 수집 endpoint 확정 중';
  }
});

/* ===== 포맷터 ===== */
const F = {
  pctSigned: v => {
    const n = Number(v);
    if (!isFinite(n)) return '—';
    const sign = n > 0 ? '+' : '';
    return sign + n.toFixed(2) + '%';
  },
  comma: v => {
    const n = Number(v);
    if (!isFinite(n)) return '—';
    return n.toLocaleString('ko-KR');
  },
  // 원 → 억원 (정수로 반올림, 천단위 콤마)
  okwon: v => {
    const n = Number(v);
    if (!isFinite(n)) return '—';
    return Math.round(n / 1e8).toLocaleString('ko-KR');
  },
  okwonSigned: v => {
    const n = Number(v);
    if (!isFinite(n)) return '—';
    const a = Math.round(n / 1e8);
    const sign = a > 0 ? '+' : '';
    return sign + a.toLocaleString('ko-KR');
  },
};

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function cellClassFor(col, raw) {
  if (col.fmt === 'pctSigned' || col.fmt === 'okwonSigned') {
    const n = Number(raw);
    if (isFinite(n)) {
      if (n > 0) return col.cls.replace('num','up');
      if (n < 0) return col.cls.replace('num','down');
    }
  }
  return col.cls;
}

/* ===== 데이터 로드 + 렌더 ===== */
const mount = document.getElementById('tableMount');
const baseEl = document.getElementById('basedateText');
const periodBar = document.getElementById('periodBar');
const cache = {};

function renderPeriodBar(cat) {
  const opts = PERIODS[cat] || [];
  if (opts.length === 0) {
    periodBar.className = 'period-bar snapshot';
    periodBar.innerHTML = '현재 시점';
    return;
  }
  // 카테고리별 마지막 선택 → 디폴트 → 첫 옵션 순으로 결정
  currentPeriod = lastPeriodByCat[cat] || DEFAULT_PERIOD[cat] || opts[0][0];
  if (!opts.find(p => p[0] === currentPeriod)) currentPeriod = opts[0][0];
  periodBar.className = 'period-bar';
  periodBar.innerHTML = `
    <span class="lbl">기간</span>
    <select id="periodSel">
      ${opts.map(([key, label]) =>
        `<option value="${key}" ${key === currentPeriod ? 'selected' : ''}>${label}</option>`
      ).join('')}
    </select>`;
}

periodBar.addEventListener('change', (e) => {
  if (e.target.id !== 'periodSel') return;
  currentPeriod = e.target.value;
  const activeCat = document.querySelector('.tab-btn.active')?.dataset.cat || 'yield';
  lastPeriodByCat[activeCat] = currentPeriod;
  loadCategory(activeCat);
});

async function loadCategory(cat) {
  const def = CATEGORIES[cat];
  if (!def) return;
  if (def.status === 'pending' || !def.columns) {
    mount.innerHTML = `
      <div class="empty">
        <b>${def.label} 데이터는 준비 중이에요</b>
        ETF CHECK 페이지에서 카테고리별 endpoint 캡쳐 작업이 끝나면 활성화됩니다.
      </div>`;
    return;
  }

  // 기간 토글 렌더
  renderPeriodBar(cat);

  mount.innerHTML = `<div class="loading"><span class="spinner-mini"></span>${def.label} 데이터 로드 중…</div>`;

  // 1d 또는 기간별 파일 fetch. 없으면 기존 {cat}.json fallback
  const cacheKey = `${cat}_${currentPeriod}`;
  let payload = cache[cacheKey];
  let periodAvailable = true;
  if (!payload) {
    // 시도 1: 사전 계산 파일 (예: yield_1w.json)
    try {
      const resp = await fetch(`data/${cat}_${currentPeriod}.json?v=${Date.now()}`, { cache: 'no-store' });
      if (resp.ok) {
        payload = await resp.json();
        cache[cacheKey] = payload;
      } else { periodAvailable = false; }
    } catch (e) { periodAvailable = false; }
    // 시도 2: fallback to 기존 {cat}.json (1일치 호환)
    if (!periodAvailable && currentPeriod === '1d') {
      try {
        const resp = await fetch(`data/${cat}.json?v=${Date.now()}`, { cache: 'no-store' });
        if (resp.ok) {
          payload = await resp.json();
          cache[cacheKey] = payload;
          periodAvailable = true;
        }
      } catch (e) {}
    }
    if (!periodAvailable || !payload) {
      const periodLabel = (PERIODS[cat] || []).find(p => p[0] === currentPeriod)?.[1] || currentPeriod;
      mount.innerHTML = `
        <div class="empty">
          <b>${periodLabel} 데이터 축적 중</b>
          매일 자동 누적 중입니다. 기간이 충분히 모이면 자동으로 활성화됩니다.
        </div>`;
      return;
    }
  }

  // basedate
  if (payload.updated_at) baseEl.textContent = payload.updated_at;

  let rows = (payload.raw && Array.isArray(payload.raw.results))
    ? payload.raw.results
    : (Array.isArray(payload.raw) ? payload.raw : []);

  // 카테고리별 클라이언트 정렬 (sortKey 정의된 경우만)
  if (def.sortKey) {
    rows = rows.slice().sort((a, b) => {
      const getVal = (r) => {
        if (def.sortKey === 'AUM_VAR_ABS') return Math.abs(Number(r.AUM_VAR) || 0);
        return Number(r[def.sortKey]) || 0;
      };
      return def.sortDir === 'desc' ? getVal(b) - getVal(a) : getVal(a) - getVal(b);
    }).slice(0, 100); // 상위 100개만
  }

  if (!rows.length) {
    mount.innerHTML = `<div class="empty"><b>표시할 데이터가 없습니다</b></div>`;
    return;
  }

  // 렌더
  const thead = def.columns.map(c =>
    `<th class="${c.cls.includes('left') ? 'left' : ''}">${c.label}</th>`
  ).join('');
  const tbody = rows.map((row, i) => {
    const tds = def.columns.map(c => {
      const raw = c.key === '_rank' ? (i + 1) : row[c.key];
      const text = c.fmt ? F[c.fmt](raw) : (raw ?? '—');
      const cls = cellClassFor(c, raw);
      // 종목명은 ellipsis로 잘릴 수 있으니 title 추가 (hover 시 전체)
      const titleAttr = (c.key === 'F16002') ? ` title="${escapeHtml(String(raw ?? ''))}"` : '';
      return `<td class="${cls}"${titleAttr}>${text}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');

  mount.innerHTML = `
    <table>
      <thead><tr>${thead}</tr></thead>
      <tbody>${tbody}</tbody>
    </table>`;
}

/* ===== 탭 클릭 ===== */
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn || btn.disabled || btn.classList.contains('active')) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  const cat = btn.dataset.cat;
  history.replaceState(null, '', '#' + cat);
  loadCategory(cat);
});

/* ===== 초기 로드 ===== */
const initCat = (location.hash.replace('#','') || 'yield');
const initBtn = document.querySelector(`.tab-btn[data-cat="${initCat}"]`);
if (initBtn && !initBtn.disabled) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === initBtn));
  loadCategory(initCat);
} else {
  loadCategory('yield');
}
</script>
</body>
