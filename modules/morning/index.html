<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>아침에 보는 글로벌증시 — 여비또니 주식봇</title>
<style>
:root {
  --bg:#f8fafc; --card:#ffffff; --thead:#f1f5f9; --line:#e2e8f0; --line-soft:#eef2f6;
  --text:#1a1d24; --text-strong:#0f172a; --muted:#64748b; --muted-2:#94a3b8;
  --accent:#0ea5e9; --accent-soft:rgba(14,165,233,.10);
  --up:#dc2626; --down:#2563eb;
}
:root[data-theme="dark"], body.theme-dark {
  --bg:#0b1220; --card:#121a2b; --thead:#0f1626; --line:#1f2a44; --line-soft:#192238;
  --text:#cbd5e1; --text-strong:#f1f5f9; --muted:#94a3b8; --muted-2:#64748b;
  --accent:#00d4a4; --accent-soft:rgba(0,212,164,.12);
  --up:#f87171; --down:#60a5fa;
}
:root[data-theme="green"], body.theme-green {
  --bg:#ecfdf5; --card:#ffffff; --thead:#f0fdf4; --line:#a7f3d0; --line-soft:#d1fae5;
  --text:#064e3b; --text-strong:#022c22; --muted:#047857; --muted-2:#10b981;
  --accent:#059669; --accent-soft:rgba(5,150,105,.12);
}

* { box-sizing:border-box; margin:0; padding:0; }
html, body { overflow-x:hidden; max-width:100vw; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55; padding:20px;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  transition:background .15s ease, color .15s ease;
}
.container { max-width:1240px; margin:0 auto; }
header { margin-bottom:14px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
.header-left { flex:1; min-width:200px; }
h1 { font-size:22px; font-weight:700; margin:0 0 2px 0; color:var(--text-strong); }
.subtitle { color:var(--muted); font-size:13px; margin:0; }
.basedate { color:var(--text); background:var(--card); border:1px solid var(--line);
  padding:6px 12px; border-radius:8px; font-size:12px; white-space:nowrap; flex-shrink:0; }
.basedate b { color:var(--accent); }
@media (max-width:720px) {
  h1 { font-size:19px; }
  header { gap:8px; }
  .basedate { font-size:11px; padding:5px 10px; }
}

/* 카드 그리드 */
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:14px; margin-top:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:18px 20px 18px; box-shadow:0 1px 3px rgba(15,23,42,.04); position:relative; overflow:hidden;
  transition: transform .15s ease, box-shadow .15s ease; }
.card:hover { transform: translateY(-1px); box-shadow:0 4px 10px rgba(15,23,42,.07); }
.card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg, rgba(148,163,184,.55), rgba(148,163,184,.15));
  border-radius:14px 0 0 14px; }
[data-theme="dark"] .card::before { background:linear-gradient(180deg, rgba(148,163,184,.45), rgba(148,163,184,.10)); }

.card-name { font-size:15px; font-weight:700; color:var(--text-strong); margin-bottom:3px; }
.card-meta { font-size:11px; color:var(--muted); margin-bottom:14px; letter-spacing:.01em; }
.card-meta b { font-weight:500; color:var(--muted); }
.card-meta .dot { display:inline-block; margin:0 6px; color:var(--muted-2); }
.card-meta .state { font-weight:600; }
.card-meta .state.live { color:#10b981; }
.card-meta .state.closed { color:var(--muted); }

/* 데이터 지연/실시간 배지 */
.card-badge {
  position:absolute; top:14px; right:14px;
  font-size:10px; font-weight:600; letter-spacing:.02em;
  padding:3px 8px; border-radius:999px;
  border:1px solid transparent;
}
.card-badge.realtime { color:#10b981; background:rgba(16,185,129,.10); border-color:rgba(16,185,129,.25); }
.card-badge.delayed  { color:var(--muted); background:rgba(148,163,184,.10); border-color:var(--line); }
[data-theme="dark"] .card-badge.realtime { color:#34d399; background:rgba(52,211,153,.12); border-color:rgba(52,211,153,.30); }

.card-price { font-size:28px; font-weight:700; color:var(--text-strong);
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; line-height:1.1; }
.card-change { margin-top:6px; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
.card-change.up   { color:var(--up); }
.card-change.down { color:var(--down); }
.card-change.flat { color:var(--muted); }

footer { color:var(--muted); font-size:12px; margin-top:18px; padding:14px 16px; background:var(--thead);
  border:1px solid var(--line); border-radius:10px; line-height:1.7; }
footer a { color:var(--accent); text-decoration:none; }

.empty { text-align:center; color:var(--muted); font-size:13px; padding:40px 20px; }

/* TradingView 섹션 */
.tv-section { margin-top:24px; }
.tv-section-title { font-size:13px; font-weight:600; color:var(--text-strong); margin-bottom:10px; letter-spacing:.01em; }
.tv-section-note { color:var(--muted); font-weight:400; font-size:12px; }
.tv-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:14px; }
.tv-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px;
  box-shadow:0 1px 3px rgba(15,23,42,.04); overflow:hidden; }
.tv-card .tradingview-widget-container { min-height:140px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-left">
      <h1>아침에 보는 글로벌증시</h1>
      <p class="subtitle">K200 야간선물 + 미국 야간 선물 + 달러 지수 · 한국 시장 방향성</p>
    </div>
    <div class="basedate" id="basedate">갱신 –</div>
  </header>

  <!-- 4종 TradingView Single Quote 위젯 통일 -->
  <div class="tv-grid">
    <div class="tv-card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
          {"symbol":"K2I1!","colorTheme":"light","isTransparent":true,"locale":"kr"}
        </script>
      </div>
    </div>
    <div class="tv-card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
          {"symbol":"OANDA:NAS100USD","colorTheme":"light","isTransparent":true,"locale":"kr"}
        </script>
      </div>
    </div>
    <div class="tv-card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
          {"symbol":"OANDA:SPX500USD","colorTheme":"light","isTransparent":true,"locale":"kr"}
        </script>
      </div>
    </div>
    <div class="tv-card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
          {"symbol":"TVC:DXY","colorTheme":"light","isTransparent":true,"locale":"kr"}
        </script>

  <footer>
    데이터: TradingView Single Quote 위젯 (K200 야간선물 + NQ/ES/DXY) — 본인 로그인 시 실시간 · <a href="https://yeobtoni.local" target="_blank">여비또니 주식봇</a>
  </footer>
</div>

<script>
// (우리 카드/WSS 코드 제거 — 모든 종목 TradingView Single Quote 위젯으로 통일)
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

// (K200 WSS 직결 제거 — TradingView 위젯으로 통일)

function connectNgt() {
  try {
    ngtWs = new WebSocket(NGT_WSS);
  } catch (e) {
    console.warn("NGT WS 생성 실패", e);
    setTimeout(connectNgt, 5000);
    return;
  }
  ngtWs.onopen = () => {
    console.log("[ngt] connected");
    ngtWs.send(JSON.stringify({ action: "subscribe", code: "1A01609" }));
  };
  ngtWs.onmessage = e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === "tick") {
      // vrss_sign: 1/2=상승, 4/5=하락 (KIS 표준)
      let change = msg.vrss;
      if (msg.vrss_sign && /^[45]$/.test(msg.vrss_sign) && change > 0) {
        change = -change;
      }
      const price = msg.price;
      const prev = (price != null && change != null) ? (price - change) : null;
      if (prev != null) ngtPrev = prev;
      k200Quote = {
        ...K200_META,
        price: price,
        previous: ngtPrev,
        change: change,
        change_pct: msg.ctrt,
        state: "REGULAR",
      };
      mergeAndRender();
    } else if (msg.type === "hello") {
      console.log("[ngt] hello", msg);
    }
  };
  ngtWs.onclose = () => {
    console.warn("[ngt] closed, 재연결 5초 후");
    setTimeout(connectNgt, 5000);
  };
  ngtWs.onerror = e => {
    console.warn("[ngt] error", e);
  };
}
connectNgt();

// 허브 테마 신호 수신
function _normalizeHubTheme(t) {
  if (t === "white") return "light";
  if (["light","dark","green"].indexOf(t) >= 0) return t;
  return null;
}
window.addEventListener("message", function(e) {
  if (e.data && e.data.type === "yeobtoni-theme") {
    var n = _normalizeHubTheme(e.data.value);
    if (n) {
      document.documentElement.setAttribute("data-theme", n);
    }
  }
});

// URL hash 의 theme=xxx 적용
(function() {
  var m = location.search.match(/[?&]theme=([^&]+)/);
  if (m) {
    var n = _normalizeHubTheme(decodeURIComponent(m[1]));
    if (n) document.documentElement.setAttribute("data-theme", n);
  }
})();
</script>
</body>
</html>
