<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>아침에 보는 글로벌증시 — 여비또니 주식봇</title>
<style>
:root {
  --bg:#f8fafc; --card:#ffffff; --thead:#f1f5f9; --line:#e2e8f0; --line-soft:#eef2f6;
  --text:#1a1d24; --text-strong:#0f172a; --muted:#64748b; --muted-2:#94a3b8;
  --accent:#0ea5e9; --accent-soft:rgba(14,165,233,.10);
  --up:#ef2d2d; --down:#1d6cff;   /* 더 쨍한 빨강/파랑 */
  --live:#16a34a; --live-bg:rgba(22,163,74,.12);
  --closed:#94a3b8; --closed-bg:rgba(148,163,184,.12);
}
:root[data-theme="dark"], body.theme-dark {
  --bg:#0b1220; --card:#121a2b; --thead:#0f1626; --line:#1f2a44; --line-soft:#192238;
  --text:#cbd5e1; --text-strong:#f1f5f9; --muted:#94a3b8; --muted-2:#64748b;
  --accent:#00d4a4; --accent-soft:rgba(0,212,164,.12);
  --up:#ff4d4f; --down:#4d8bff;
  --live:#22c55e; --live-bg:rgba(34,197,94,.14);
  --closed:#94a3b8; --closed-bg:rgba(148,163,184,.10);
}
:root[data-theme="green"], body.theme-green {
  --bg:#ecfdf5; --card:#ffffff; --thead:#f0fdf4; --line:#a7f3d0; --line-soft:#d1fae5;
  --text:#064e3b; --text-strong:#022c22; --muted:#047857; --muted-2:#10b981;
  --accent:#059669; --accent-soft:rgba(5,150,105,.12);
}

* { box-sizing:border-box; margin:0; padding:0; }
html, body { overflow-x:hidden; max-width:100vw; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55; padding:20px;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  transition:background .15s ease, color .15s ease;
}
.container { max-width:1240px; margin:0 auto; }
header { margin-bottom:14px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
.header-left { flex:1; min-width:200px; }
h1 { font-size:22px; font-weight:700; margin:0 0 2px 0; color:var(--text-strong); }
.subtitle { color:var(--muted); font-size:13px; margin:0; }
.basedate { color:var(--text); background:var(--card); border:1px solid var(--line);
  padding:6px 12px; border-radius:8px; font-size:12px; white-space:nowrap; flex-shrink:0; }
.basedate b { color:var(--accent); }
@media (max-width:720px) {
  h1 { font-size:19px; }
  header { gap:8px; }
  .basedate { font-size:11px; padding:5px 10px; }
}

/* 카드 그리드 */
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:14px; margin-top:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:18px 20px 18px; box-shadow:0 1px 3px rgba(15,23,42,.04); position:relative; overflow:hidden;
  transition: transform .15s ease, box-shadow .15s ease; }
.card:hover { transform: translateY(-1px); box-shadow:0 4px 10px rgba(15,23,42,.07); }
.card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg, rgba(148,163,184,.55), rgba(148,163,184,.15));
  border-radius:14px 0 0 14px; }
[data-theme="dark"] .card::before { background:linear-gradient(180deg, rgba(148,163,184,.45), rgba(148,163,184,.10)); }

.card-name { font-size:15px; font-weight:700; color:var(--text-strong); margin-bottom:3px; }
.card-meta { font-size:11px; color:var(--muted); margin-bottom:14px; letter-spacing:.01em; }
.card-meta b { font-weight:500; color:var(--muted); }
.card-meta .dot { display:inline-block; margin:0 6px; color:var(--muted-2); }
.card-meta .state { font-weight:600; }
.card-meta .state.live { color:#10b981; }
.card-meta .state.closed { color:var(--muted); }

/* 데이터 지연/실시간 배지 */
.card-badge {
  position:absolute; top:14px; right:14px;
  font-size:10px; font-weight:600; letter-spacing:.02em;
  padding:3px 8px; border-radius:999px;
  border:1px solid transparent;
}
.card-badge.realtime { color:#10b981; background:rgba(16,185,129,.10); border-color:rgba(16,185,129,.25); }
.card-badge.delayed  { color:var(--muted); background:rgba(148,163,184,.10); border-color:var(--line); }
[data-theme="dark"] .card-badge.realtime { color:#34d399; background:rgba(52,211,153,.12); border-color:rgba(52,211,153,.30); }

.card-price { font-size:28px; font-weight:700; color:var(--text-strong);
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; line-height:1.1; }
.card-change { margin-top:6px; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
.card-change.up   { color:var(--up); }
.card-change.down { color:var(--down); }
.card-change.flat { color:var(--muted); }

footer { color:var(--muted); font-size:12px; margin-top:18px; padding:14px 16px; background:var(--thead);
  border:1px solid var(--line); border-radius:10px; line-height:1.7; }
footer a { color:var(--accent); text-decoration:none; }

.empty { text-align:center; color:var(--muted); font-size:13px; padding:40px 20px; }

/* 섹션 (글로벌 선물 / 달러 · 환율 · 금) */
.cards-section { margin-top:28px; }
.cards-section:first-of-type { margin-top:20px; }
.section-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
.section-title { font-size:16px; font-weight:700; color:var(--text-strong);
  margin:0 0 3px 0; letter-spacing:-.005em; }
.section-desc { color:var(--muted); font-size:12px; margin:0; }
.section-count { color:var(--muted); font-size:12px; flex-shrink:0; align-self:flex-start; padding-top:2px; }
.tv-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
.tv-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px;
  box-shadow:0 1px 3px rgba(15,23,42,.04); overflow:hidden; min-height:140px; }
.tv-card .tradingview-widget-container { min-height:130px; }

/* K200 우리 카드 — TradingView 위젯과 비슷한 디자인 */
.our-card-inner { padding:12px 14px 10px; }
.our-card-head { display:flex; align-items:center; justify-content:space-between; }
.our-card-name { font-size:15px; font-weight:700; color:var(--text-strong); letter-spacing:-.005em; }
.our-card-tag { font-size:10px; font-weight:700; letter-spacing:.02em; white-space:nowrap;
  padding:3px 8px; border-radius:999px; border:1px solid transparent; }
.our-card-tag.live { color:var(--live); background:var(--live-bg); border-color:var(--live-bg); }
.our-card-tag.closed { color:var(--closed); background:var(--closed-bg); border-color:var(--closed-bg); }
.our-card-ticker { color:var(--muted); font-size:11px; margin-top:3px; letter-spacing:.01em; }
/* 옛 class 호환 */
.our-card-symbol { font-size:15px; font-weight:700; color:var(--text-strong); }
.our-card-sub { color:var(--muted); font-size:11px; margin-top:2px; }
.our-card-tag-delayed { color:var(--closed); }
.our-card-price { font-size:28px; font-weight:700; color:var(--text-strong);
  font-variant-numeric:tabular-nums; margin-top:14px; letter-spacing:-.01em; line-height:1; }
.our-card-change { margin-top:6px; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
.our-card-change.up { color:var(--up); }
.our-card-change.down { color:var(--down); }
.our-card-change.flat { color:var(--muted); }
.empty-card { padding:50px 14px; text-align:center; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-left">
      <h1>아침에 보는 글로벌증시</h1>
      <p class="subtitle">글로벌 선물 · 달러 · 환율 · 금</p>
    </div>
    <div class="basedate" id="basedate">갱신 –</div>
  </header>

  <!-- 섹션 1: 글로벌 선물 -->
  <section class="cards-section">
    <div class="section-header">
      <div>
        <h2 class="section-title">글로벌 선물</h2>
        <p class="section-desc">코스피 야간선물 + 미국 선물</p>
      </div>
      <span class="section-count">3개 종목</span>
    </div>
    <div class="tv-grid">
      <div class="tv-card" id="k200-card"><div class="empty-card">K200 야간선물 연결 중…</div></div>
      <div class="tv-card" id="us-card-NQ"><div class="empty-card">로딩 중…</div></div>
      <div class="tv-card" id="us-card-ES"><div class="empty-card">로딩 중…</div></div>
    </div>
  </section>

  <!-- 섹션 2: 달러 · 환율 · 금 -->
  <section class="cards-section">
    <div class="section-header">
      <div>
        <h2 class="section-title">달러 · 환율 · 금</h2>
        <p class="section-desc">달러 인덱스 + 원/달러 환율 + 금</p>
      </div>
      <span class="section-count">3개 종목</span>
    </div>
    <div class="tv-grid">
      <div class="tv-card" id="us-card-DXY"><div class="empty-card">로딩 중…</div></div>
      <div class="tv-card" id="us-card-KRW"><div class="empty-card">로딩 중…</div></div>
      <div class="tv-card" id="us-card-GC"><div class="empty-card">로딩 중…</div></div>
    </div>
  </section>

  <footer>
    데이터: KIS H0MFCNT0 (K200 야간선물 — 1분 갱신) + Yahoo Finance via CF Worker (NQ/ES/GC/DXY — 5분 갱신) · <a href="https://yeobtoni.local" target="_blank">여비또니 주식봇</a>
  </footer>
</div>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}
function fmtPrice(n) {
  if (n == null || isNaN(n)) return "—";
  return Number(n).toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtChange(n) {
  if (n == null || isNaN(n)) return "—";
  const sign = n >= 0 ? "+" : "";
  return sign + Number(n).toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPct(p) {
  if (p == null || isNaN(p)) return "—";
  const sign = p >= 0 ? "+" : "";
  return sign + p.toFixed(2) + "%";
}

// ============================================================
// K200 야간선물 — ngt_quote.json fetch (1분 polling, KIS WSS → VM push)
// ============================================================
function renderK200(q) {
  const card = document.getElementById("k200-card");
  if (!q || q.price == null) {
    card.innerHTML = `
      <div class="our-card-inner">
        <div class="our-card-head">
          <span class="our-card-name">K200 야간선물 · KRX 야간</span>
          <span class="our-card-tag our-card-tag-delayed">대기</span>
        </div>
        <div class="our-card-ticker">K2I1!</div>
        <div class="our-card-price" style="opacity:.4;">—</div>
        <div class="our-card-change flat" style="opacity:.5;">거래 발생 시 자동 갱신</div>
      </div>`;
    return;
  }
  const dir = q.change > 0 ? "up" : (q.change < 0 ? "down" : "flat");
  card.innerHTML = `
    <div class="our-card-inner">
      <div class="our-card-head">
        <span class="our-card-name">${escapeHtml(q.name || "K200 야간선물")}</span>
        <span class="our-card-tag">실시간 ●</span>
      </div>
      <div class="our-card-ticker">${escapeHtml(q.symbol || "K2I1!")} · ${escapeHtml(q.exchange || "KRX 야간")} · 거래 중</div>
      <div class="our-card-price">${fmtPrice(q.price)}</div>
      <div class="our-card-change ${dir}">${fmtChange(q.change)} (${fmtPct(q.change_pct)})</div>
    </div>
  `;
}

function loadNgt() {
  fetch("data/ngt_quote.json?v=" + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject("HTTP " + r.status))
    .then(renderK200)
    .catch(err => {
      const card = document.getElementById("k200-card");
      card.innerHTML = '<div class="empty-card">K200 로딩 실패: ' + escapeHtml(String(err)) + '</div>';
    });
}
loadNgt();
setInterval(loadNgt, 60 * 1000);  // 1분마다

// ============================================================
// 미국 선물 (NQ/ES/GC/DXY) — us_quotes.json (Yahoo via CF Worker, 5분 갱신)
// ============================================================
const STATE_LABEL = {
  REGULAR: "거래 중", PRE: "장 전", POST: "시간외",
  CLOSED: "장 마감", PREPRE: "장 전", POSTPOST: "시간외",
};

function renderUsCard(q) {
  const el = document.getElementById("us-card-" + q.key);
  if (!el) return;
  const dir = q.change > 0 ? "up" : (q.change < 0 ? "down" : "flat");
  const tag = q.delayed
    ? '<span class="our-card-tag our-card-tag-delayed">15분 지연</span>'
    : '<span class="our-card-tag">실시간 ●</span>';
  const stateLabel = STATE_LABEL[q.state] || q.state || "";
  el.innerHTML = `
    <div class="our-card-inner">
      <div class="our-card-head">
        <span class="our-card-name">${escapeHtml(q.name)}</span>
        ${tag}
      </div>
      <div class="our-card-ticker">${escapeHtml(q.symbol)} · ${escapeHtml(q.exchange)}${stateLabel ? ' · ' + escapeHtml(stateLabel) : ''}</div>
      <div class="our-card-price">${fmtPrice(q.price)}</div>
      <div class="our-card-change ${dir}">${fmtChange(q.change)} (${fmtPct(q.change_pct)})</div>
    </div>
  `;
}

function loadUS() {
  fetch("data/us_quotes.json?v=" + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject("HTTP " + r.status))
    .then(p => {
      const quotes = p.quotes || [];
      const baseEl = document.getElementById("basedate");
      if (baseEl) baseEl.innerHTML = "갱신 <b>" + (p.fetched_at || "—") + "</b>";
      for (const q of quotes) renderUsCard(q);
    })
    .catch(err => {
      for (const k of ["NQ","ES","DXY","KRW","GC"]) {
        const el = document.getElementById("us-card-" + k);
        if (el) el.innerHTML = '<div class="empty-card">로딩 실패: ' + escapeHtml(String(err)) + '</div>';
      }
    });
}
loadUS();
setInterval(loadUS, 5 * 60 * 1000);

// 허브 테마 신호 수신
function _normalizeHubTheme(t) {
  if (t === "white") return "light";
  if (["light","dark","green"].indexOf(t) >= 0) return t;
  return null;
}
window.addEventListener("message", function(e) {
  if (e.data && e.data.type === "yeobtoni-theme") {
    var n = _normalizeHubTheme(e.data.value);
    if (n) {
      document.documentElement.setAttribute("data-theme", n);
    }
  }
});

// URL hash 의 theme=xxx 적용
(function() {
  var m = location.search.match(/[?&]theme=([^&]+)/);
  if (m) {
    var n = _normalizeHubTheme(decodeURIComponent(m[1]));
    if (n) document.documentElement.setAttribute("data-theme", n);
  }
})();
</script>
</body>
</html>
