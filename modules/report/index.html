<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>종목보고서 — 여비또니 주식봇</title>
<style>
:root {
  --bg:#f8fafc; --card:#ffffff; --thead:#f1f5f9; --line:#e2e8f0; --line-soft:#eef2f6;
  --text:#1a1d24; --text-strong:#0f172a; --muted:#64748b; --muted-2:#94a3b8;
  --accent:#0ea5e9; --accent-soft:rgba(14,165,233,.10);
  --kospi:#dc2626; --kosdaq:#2563eb; --nasdaq:#059669;
  --nyse:#8b5cf6; --amex:#ca8a04;
}
:root[data-theme="dark"], body.theme-dark {
  --bg:#0b1220; --card:#121a2b; --thead:#0f1626; --line:#1f2a44; --line-soft:#192238;
  --text:#cbd5e1; --text-strong:#f1f5f9; --muted:#94a3b8; --muted-2:#64748b;
  --accent:#22d3ee; --accent-soft:rgba(34,211,238,.12);
  --kospi:#f87171; --kosdaq:#60a5fa; --nasdaq:#34d399;
  --nyse:#a78bfa; --amex:#facc15;
}
:root[data-theme="green"], body.theme-green {
  --bg:#ecfdf5; --card:#ffffff; --thead:#f0fdf4; --line:#a7f3d0; --line-soft:#d1fae5;
  --text:#064e3b; --text-strong:#022c22; --muted:#047857; --muted-2:#10b981;
  --accent:#059669; --accent-soft:rgba(5,150,105,.12);
  --kospi:#dc2626; --kosdaq:#1d4ed8; --nasdaq:#047857;
  --nyse:#7c3aed; --amex:#a16207;
}

* { box-sizing:border-box; margin:0; padding:0; }
html, body { overflow-x:hidden; max-width:100vw; height:100%; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55; padding:20px;
  transition:background .15s ease, color .15s ease;
}
.container { max-width:1200px; margin:0 auto; }

header { margin-bottom:14px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
.header-left { flex:1; min-width:200px; }
h1 { font-size:22px; font-weight:700; margin:0 0 2px 0; color:var(--text-strong); }
.subtitle { color:var(--muted); font-size:13px; margin:0; }
.basedate { color:var(--muted); background:var(--card); border:1px solid var(--line);
  padding:6px 12px; border-radius:8px; font-size:12px; white-space:nowrap; flex-shrink:0; }
.basedate b { color:var(--accent); }

/* 검색 + 정렬 */
.toolbar { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.toolbar input, .toolbar select { background:var(--card); border:1px solid var(--line);
  color:var(--text); font:inherit; font-size:13px; padding:8px 12px; border-radius:8px; outline:none;
  transition:border-color .12s ease; }
.toolbar input:focus, .toolbar select:focus { border-color:var(--accent); }
.toolbar input { flex:1; min-width:160px; }

/* 결과 테이블 */
.tbl-card { background:var(--card); border:1px solid var(--line); border-radius:14px;
  overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  box-shadow:0 1px 3px rgba(15,23,42,.04);
  scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
.tbl-card::-webkit-scrollbar { height:8px; }
.tbl-card::-webkit-scrollbar-track { background:transparent; }
.tbl-card::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px;
  border:2px solid var(--card); background-clip:padding-box; }
.tbl-card::-webkit-scrollbar-thumb:hover { background:var(--muted); border:2px solid var(--card); background-clip:padding-box; }
table { width:100%; border-collapse:collapse; min-width:680px; }
thead th { background:var(--thead); color:var(--muted); font-weight:700; font-size:12px;
  padding:11px 12px; text-align:center; border-bottom:1px solid var(--line);
  white-space:nowrap; position:sticky; top:0; z-index:1; }
thead th.left { text-align:left; }
tbody td { padding:11px 12px; border-bottom:1px solid var(--line-soft); font-size:13px;
  color:var(--text); text-align:center; vertical-align:middle; }
tbody td.left { text-align:left; }
tbody td.date { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; font-size:12px; }
tbody td.stock { white-space:nowrap; }
tbody td.title { color:var(--text-strong); font-weight:600; }
tbody td.pages { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
tbody tr { cursor:pointer; transition:background .12s ease; }
tbody tr:hover { background:var(--accent-soft); }
tbody tr:last-child td { border-bottom:none; }

.badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px;
  letter-spacing:.02em; vertical-align:middle; margin-right:6px; }
.badge.kospi  { background:rgba(220,38,38,.12); color:var(--kospi); }
.badge.kosdaq { background:rgba(37,99,235,.12); color:var(--kosdaq); }
.badge.nasdaq { background:rgba(5,150,105,.12); color:var(--nasdaq); }
.badge.nyse   { background:rgba(139,92,246,.14); color:var(--nyse); }
.badge.amex   { background:rgba(202,138,4,.14);  color:var(--amex); }
.badge.rev { background:var(--accent-soft); color:var(--accent); font-size:10px; margin-left:6px; }
.stock-name { font-weight:700; color:var(--text-strong); }
.title-text { display:inline-block; max-width:560px; overflow:hidden; text-overflow:ellipsis;
  vertical-align:middle; }

/* 빈 상태 */
.empty-state { padding:60px 30px; text-align:center; color:var(--muted); }
.empty-state b { display:block; color:var(--text-strong); font-size:16px; font-weight:700; margin-bottom:10px; }
.empty-state p { font-size:13px; line-height:1.7; max-width:520px; margin:0 auto; }

/* 뷰어 — 풀스크린 모달 */
.viewer { position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg);
  z-index:100; display:none; flex-direction:column; }
.viewer.active { display:flex; }
.viewer-head { background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px;
  display:flex; align-items:center; gap:12px; flex-shrink:0; }
.viewer-back { appearance:none; border:1px solid var(--line); background:var(--thead); color:var(--muted);
  font:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:8px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; flex-shrink:0; }
.viewer-back:hover { color:var(--text-strong); border-color:var(--muted-2); }
.viewer-title { font-size:14px; font-weight:700; color:var(--text-strong); flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.viewer-actions { display:flex; gap:6px; flex-shrink:0; }
.viewer-action { appearance:none; border:1px solid var(--line); background:transparent; color:var(--muted);
  font:inherit; font-size:12px; font-weight:600; padding:6px 10px; border-radius:7px; cursor:pointer;
  text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
.viewer-action:hover { color:var(--text-strong); border-color:var(--muted-2); background:var(--thead); }
.viewer-body { flex:1; overflow:hidden; background:#ffffff; }
.viewer-body iframe { width:100%; height:100%; border:0; display:block; background:#ffffff; }

@media (max-width:720px) {
  body { padding:14px 10px; }
  h1 { font-size:18px; }
  .subtitle { font-size:12px; }
  .basedate { font-size:11px; padding:4px 9px; }
  thead th, tbody td { padding:9px 10px; font-size:12px; }
  /* 모바일: 헤더 종목·제목만 가운데 정렬 + 제목 한 줄 강제 */
  thead th.left { text-align:center; }
  tbody td.stock, tbody td.title { white-space:nowrap; }
  .title-text { max-width:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .viewer-head { padding:8px 12px; }
  .viewer-title { font-size:13px; }
  .viewer-actions .label { display:none; }
}
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-left">
      <h1>종목보고서</h1>
      <p class="subtitle">종목 리서치 보고서</p>
    </div>
    <div class="basedate">총 <b id="countText">0</b>건</div>
  </header>

  <div class="toolbar">
    <input id="searchInput" type="search" placeholder="종목명 / 테마 검색…" autocomplete="off">
    <select id="marketFilter">
      <option value="">전체 시장</option>
      <option value="코스피">코스피</option>
      <option value="코스닥">코스닥</option>
    </select>
    <select id="sortOrder">
      <option value="date-desc">최신순</option>
      <option value="date-asc">오래된순</option>
      <option value="name">종목명순</option>
      <option value="pages-desc">페이지순</option>
    </select>
  </div>

  <div class="tbl-card">
    <div id="tableMount"></div>
  </div>

</div>

<!-- 뷰어 풀스크린 -->
<div class="viewer" id="viewer">
  <div class="viewer-head">
    <button class="viewer-back" onclick="closeViewer()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      목록
    </button>
    <div class="viewer-title" id="viewerTitle">—</div>
    <div class="viewer-actions">
      <a class="viewer-action" id="viewerOpenNew" target="_blank" rel="noopener" title="새 탭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        <span class="label">새 탭</span>
      </a>
    </div>
  </div>
  <div class="viewer-body"><iframe id="viewerFrame" referrerpolicy="no-referrer"></iframe></div>
</div>

<script>
/* ===== 테마 동기화 ===== */
(function(){
  const root = document.documentElement;
  function setTheme(t) {
    if (!['light','dark','green'].includes(t)) return;
    root.setAttribute('data-theme', t);
    document.body.className = 'theme-' + t;
  }
  const qs = new URLSearchParams(location.search);
  setTheme(qs.get('theme') || 'light');
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (m && m.type === 'yeobtoni-theme' && m.value) setTheme(m.value);
  });
})();

/* ===== 데이터 ===== */
const mount = document.getElementById('tableMount');
const countText = document.getElementById('countText');
const searchInput = document.getElementById('searchInput');
const marketFilter = document.getElementById('marketFilter');
const sortOrder = document.getElementById('sortOrder');

let ALL = [];

function normalizeMarket(m) {
  if (m === 'KOSPI') return '코스피';
  if (m === 'KOSDAQ') return '코스닥';
  return m;
}

async function load() {
  try {
    const resp = await fetch('data/index.json?v=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) { ALL = []; render(); return; }
    ALL = await resp.json();
    if (!Array.isArray(ALL)) ALL = [];
    ALL.forEach(r => { r._market = normalizeMarket(r.market || ''); });
    render();
  } catch (e) {
    ALL = [];
    render();
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function filterSort() {
  const q = (searchInput.value || '').trim().toLowerCase();
  const mkt = marketFilter.value;
  let arr = ALL.filter(r => {
    if (mkt && r._market !== mkt) return false;
    if (q) {
      const hay = `${r.name||''} ${(r.themes||[]).join(' ')}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const order = sortOrder.value;
  arr.sort((a,b) => {
    if (order === 'date-asc') return (a.date||'').localeCompare(b.date||'');
    if (order === 'name') return (a.name||'').localeCompare(b.name||'', 'ko');
    if (order === 'pages-desc') return (b.pages||0) - (a.pages||0);
    return (b.date||'').localeCompare(a.date||'');
  });
  return arr;
}

function render() {
  const arr = filterSort();
  countText.textContent = arr.length;

  if (arr.length === 0) {
    mount.innerHTML = `
      <div class="empty-state">
        <b>${ALL.length === 0 ? '아직 보고서가 없습니다' : '검색 결과가 없습니다'}</b>
        <p>${ALL.length === 0
          ? '보고서작성모듈 폴더에 새 보고서가 저장되면 자동으로 표시됩니다.'
          : '검색어나 필터를 바꿔보세요.'}</p>
      </div>`;
    return;
  }

  const rows = arr.map(r => {
    const dateDisp = r.date ? r.date.replace(/^20/,'').replace(/-/g,'.') : '—';
    const _mkt = (r._market || '').toUpperCase();
    const mktCls =
      r._market === '코스피' ? 'kospi' :
      r._market === '코스닥' ? 'kosdaq' :
      (r._market === '나스닥' || _mkt === 'NASDAQ') ? 'nasdaq' :
      _mkt === 'NYSE' ? 'nyse' :
      _mkt === 'AMEX' ? 'amex' :
      'kospi';
    const themes = (r.themes || []).join(' · ');
    const revBadge = r.revision ? '<span class="badge rev">보강판</span>' : '';
    const pages = (r.pages != null) ? `${r.pages}p` : '—';
    return `
      <tr data-file="${escapeHtml(r.file)}" data-title="${escapeHtml(r.name)}">
        <td class="date">${dateDisp}</td>
        <td class="stock left">
          <span class="badge ${mktCls}">${escapeHtml(r._market || '—')}</span>
          <span class="stock-name">${escapeHtml(r.name || '—')}</span>
        </td>
        <td class="title left">
          <span class="title-text">${escapeHtml(themes)}</span>${revBadge}
        </td>
        <td class="pages">${pages}</td>
      </tr>`;
  }).join('');

  mount.innerHTML = `
    <table>
      <thead><tr>
        <th>작성일</th>
        <th class="left">종목</th>
        <th class="left">제목</th>
        <th>페이지수</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  mount.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => openViewer(tr.dataset.file, tr.dataset.title));
  });
}

/* ===== 뷰어 ===== */
const viewer = document.getElementById('viewer');
const viewerTitle = document.getElementById('viewerTitle');
const viewerFrame = document.getElementById('viewerFrame');
const viewerOpenNew = document.getElementById('viewerOpenNew');

function openViewer(file, title) {
  const src = `data/${file}?v=${Date.now()}`;
  viewerFrame.src = src;
  viewerTitle.textContent = title || file;
  viewerOpenNew.href = `data/${file}`;
  viewer.classList.add('active');
  document.body.style.overflow = 'hidden';
  history.replaceState(null, '', '#' + encodeURIComponent(file));
}

/* ===== iframe 로드 후 모바일 가로 흔들림 방지 — viewport + 폭 제약 주입 ===== */
viewerFrame.addEventListener('load', () => {
  try {
    const doc = viewerFrame.contentDocument;
    if (!doc || !doc.head) return;
    // viewport meta 없으면 추가
    let meta = doc.querySelector('meta[name="viewport"]');
    if (!meta) {
      meta = doc.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, initial-scale=1';
      doc.head.appendChild(meta);
    }
    // 모바일 가로 흔들림 방지 CSS
    const style = doc.createElement('style');
    style.textContent = `
      html, body { max-width:100vw !important; overflow-x:hidden !important; }
      body { word-wrap:break-word; word-break:break-word; }
      img, video, svg, iframe { max-width:100% !important; height:auto; }
      table { max-width:100% !important; }
      pre, code { white-space:pre-wrap !important; word-wrap:break-word; }
      * { max-width:100vw; box-sizing:border-box; }
    `;
    doc.head.appendChild(style);
  } catch (e) { /* 크로스 오리진이면 패스 */ }
});
function closeViewer() {
  viewer.classList.remove('active');
  viewerFrame.src = 'about:blank';
  document.body.style.overflow = '';
  history.replaceState(null, '', location.pathname + location.search);
}
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && viewer.classList.contains('active')) closeViewer();
});

/* ===== 이벤트 + 초기 ===== */
searchInput.addEventListener('input', render);
marketFilter.addEventListener('change', render);
sortOrder.addEventListener('change', render);
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
